theme:
  name: material
  icon:
    admonition:
      example: octicons/terminal-16
    search: material/magnify
  font:
    text: Roboto
    code: Roboto Mono
  features:
    # - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.integrate
  language: es
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: lime
      accent: deep purple

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# El sitio publicado contiene únicamente el material para el alumnado.
exclude_docs: |
  **/node_modules/**
  examenes/**
  **/Guion_docente.md
  **/figma-plugin/**
  **/mirada-ud1.zip
  **/guia.html
  **/guion_clase_*.md
  **/GUIA_CLASE.md
  **/*_sol*/**
  **/*_sol*
hooks:
  - herramientas/publicacion_hook.py
extra:
  audiencia: alumnado
