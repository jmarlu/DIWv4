<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img"><title>09 · Solicitud con error</title><g aria-label="09 · Solicitud con error" transform="translate(0,0)" opacity="1"><rect x="0" y="0" width="1280" height="810" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><g aria-label="Tamaño=Amplio" transform="translate(0,0)" opacity="1"><rect x="0" y="0" width="1280" height="88" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Marca" data-width="220" xml:space="preserve" x="80" y="54" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#172F2C"><tspan x="80" dy="0">mirada.</tspan></text><text aria-label="Navegación" data-width="540" xml:space="preserve" x="660" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172F2C"><tspan x="660" dy="0">Actividades        La asociación        Contacto</tspan></text></g><text aria-label="Etiqueta" data-width="1120" xml:space="preserve" x="80" y="162" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#245C4D"><tspan x="80" dy="0">SOLICITUD / LA LUZ DEL SÁBADO</tspan></text><text aria-label="Título" data-width="1120" xml:space="preserve" x="80" y="230" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#172F2C"><tspan x="80" dy="0">Un paso para salir a mirar.</tspan></text><text aria-label="Contexto" data-width="520" xml:space="preserve" x="80" y="302" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#52665F"><tspan x="80" dy="0">Prototipo de clase. Los campos son simulados.</tspan><tspan x="80" dy="28.0">No se envían datos ni se reserva una plaza.</tspan></text><text aria-label="Nota" data-width="500" xml:space="preserve" x="80" y="410" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#172F2C"><tspan x="80" dy="0">En Figma representamos estados.</tspan><tspan x="80" dy="25.2">La validación real se hará en HTML.</tspan></text><g aria-label="Estado=Normal" transform="translate(760,280)" opacity="1"><rect x="0" y="0" width="344" height="114" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Etiqueta" data-width="344" xml:space="preserve" x="0" y="14" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172F2C"><tspan x="0" dy="0">Nombre ficticio</tspan></text><g aria-label="Control" transform="translate(0,30)" opacity="1"><rect x="0" y="0" width="344" height="48" rx="8" fill="#FFFFFF" stroke="#245C4D" stroke-width="1"/></g><text aria-label="Valor" data-width="312" xml:space="preserve" x="14" y="58" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#172F2C"><tspan x="14" dy="0">Alex de Prueba</tspan></text><text aria-label="Ayuda" data-width="344" xml:space="preserve" x="0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#52665F"><tspan x="0" dy="0">Todos los campos son obligatorios.</tspan></text></g><g aria-label="Estado=Error" transform="translate(760,424)" opacity="1"><rect x="0" y="0" width="344" height="114" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Etiqueta" data-width="344" xml:space="preserve" x="0" y="14" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#172F2C"><tspan x="0" dy="0">Correo de prueba</tspan></text><g aria-label="Control" transform="translate(0,30)" opacity="1"><rect x="0" y="0" width="344" height="48" rx="8" fill="#FFFFFF" stroke="#A02B31" stroke-width="1"/></g><text aria-label="Valor" data-width="312" xml:space="preserve" x="14" y="58" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#172F2C"><tspan x="14" dy="0">persona@</tspan></text><text aria-label="Ayuda" data-width="344" xml:space="preserve" x="0" y="100" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A02B31"><tspan x="0" dy="0">Escribe un correo completo.</tspan></text></g><g aria-label="Tipo=Primario, Estado=Normal" transform="translate(760,584)" opacity="1"><rect x="0" y="0" width="216" height="48" rx="8" fill="#245C4D" stroke="none" stroke-width="1"/><text aria-label="Etiqueta" data-width="184" xml:space="preserve" x="16" y="28" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="16" dy="0">Enviar solicitud</tspan></text></g><text aria-label="Volver" data-width="400" xml:space="preserve" x="80" y="706" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#245C4D"><tspan x="80" dy="0">Volver a la actividad</tspan></text><text aria-label="Corregir" data-width="400" xml:space="preserve" x="760" y="686" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#245C4D"><tspan x="760" dy="0">Simular correo correcto y continuar</tspan></text></g></svg>