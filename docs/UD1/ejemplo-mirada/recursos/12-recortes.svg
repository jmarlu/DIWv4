<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img"><title>12 · Máscaras y composición</title><g aria-label="12 · Máscaras y composición" transform="translate(0,0)" opacity="1"><rect x="0" y="0" width="1280" height="870" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Sección" data-width="1152" xml:space="preserve" x="64" y="53" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#245C4D"><tspan x="64" dy="0">UD1 / RECORTAR Y COMPONER</tspan></text><text aria-label="Título" data-width="1152" xml:space="preserve" x="64" y="108" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#172F2C"><tspan x="64" dy="0">El efecto tiene que ayudar al mensaje</tspan></text><text aria-label="Máscara circular" data-width="536" xml:space="preserve" x="64" y="164" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#172F2C"><tspan x="64" dy="0">Máscara circular</tspan></text><svg x="64" y="194" xmlns="http://www.w3.org/2000/svg" width="536" height="348" viewBox="0 0 800 520"><defs><clipPath id="circulo"><circle cx="280" cy="260" r="244"/></clipPath></defs><g clip-path="url(#circulo)"><rect width="800" height="520" fill="#D8E1C6"/><circle cx="602" cy="128" r="70" fill="#F4CB79"/><path d="M0 340 L180 150 L405 365 L570 205 L800 370 V520 H0Z" fill="#567769"/><path d="M0 415 L300 265 L555 430 L800 300 V520 H0Z" fill="#245C4D"/><path d="M290 520 L460 377 L500 396 L375 520Z" fill="#F0D39B"/><rect x="80" y="305" width="144" height="98" rx="14" fill="#172F2C"/><rect x="112" y="288" width="52" height="25" rx="5" fill="#172F2C"/><circle cx="153" cy="354" r="34" fill="#FAF8F2"/><circle cx="153" cy="354" r="24" fill="#739286"/><circle cx="198" cy="327" r="5" fill="#F4CB79"/></g></svg><text aria-label="Degradado hacia el fondo" data-width="536" xml:space="preserve" x="664" y="164" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#172F2C"><tspan x="664" dy="0">Degradado hacia el fondo</tspan></text><svg x="664" y="194" xmlns="http://www.w3.org/2000/svg" width="536" height="348" viewBox="0 0 800 520"><defs><linearGradient id="suave"><stop offset="0" stop-color="#FAF8F2"/><stop offset="0.8" stop-color="#FAF8F2" stop-opacity="0"/></linearGradient></defs><rect width="800" height="520" fill="#D8E1C6"/><circle cx="602" cy="128" r="70" fill="#F4CB79"/><path d="M0 340 L180 150 L405 365 L570 205 L800 370 V520 H0Z" fill="#567769"/><path d="M0 415 L300 265 L555 430 L800 300 V520 H0Z" fill="#245C4D"/><path d="M290 520 L460 377 L500 396 L375 520Z" fill="#F0D39B"/><rect x="80" y="305" width="144" height="98" rx="14" fill="#172F2C"/><rect x="112" y="288" width="52" height="25" rx="5" fill="#172F2C"/><circle cx="153" cy="354" r="34" fill="#FAF8F2"/><circle cx="153" cy="354" r="24" fill="#739286"/><circle cx="198" cy="327" r="5" fill="#F4CB79"/><rect width="800" height="520" fill="url(#suave)"/></svg><g aria-label="Etiqueta superpuesta" transform="translate(104,490)" opacity="1"><rect x="0" y="0" width="208" height="48" rx="8" fill="#245C4D" stroke="none" stroke-width="1"/></g><text aria-label="Etiqueta" data-width="188" xml:space="preserve" x="120" y="518" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF"><tspan x="120" dy="0">SALIR A OBSERVAR</tspan></text><text aria-label="Explicación" data-width="1152" xml:space="preserve" x="64" y="622" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#172F2C"><tspan x="64" dy="0">La etiqueta se superpone a la imagen, sin tapar el sujeto.</tspan><tspan x="64" dy="30.799999999999997">El degradado integra el recurso con el fondo.</tspan><tspan x="64" dy="30.799999999999997">La máscara conserva el punto de interés dentro del recorte.</tspan></text><text aria-label="Tensión" data-width="1152" xml:space="preserve" x="64" y="780" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#172F2C"><tspan x="64" dy="0">PRÁCTICA DE TENSIÓN: duplica la etiqueta, gírala 6° y compara.</tspan><tspan x="64" dy="25.2">Elige la versión que mantenga legibilidad y equilibrio.</tspan></text></g></svg>