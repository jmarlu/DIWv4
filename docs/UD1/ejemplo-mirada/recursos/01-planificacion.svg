<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>01 · Brief, mapa y flujo</title><g aria-label="01 · Brief, mapa y flujo" transform="translate(0,0)" opacity="1"><rect x="0" y="0" width="1280" height="840" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Sección" data-width="1152" xml:space="preserve" x="64" y="53" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#245C4D"><tspan x="64" dy="0">UD1 / ANTES DE DIBUJAR</tspan></text><text aria-label="Título" data-width="1152" xml:space="preserve" x="64" y="108" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#172F2C"><tspan x="64" dy="0">Una tarea organiza el diseño</tspan></text><text aria-label="Brief" data-width="1120" xml:space="preserve" x="64" y="170" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#172F2C"><tspan x="64" dy="0">Problema: cuesta encontrar cuándo y cómo participar.</tspan><tspan x="64" dy="28.0">Usuario: persona que consulta una actividad desde el móvil.</tspan><tspan x="64" dy="28.0">Tarea: averiguar horario, material y forma de inscripción.</tspan><tspan x="64" dy="28.0">Hipótesis: busca la fecha antes de elegir. Aún no comprobada.</tspan></text><g aria-label="Mapa fondo" transform="translate(64,320)" opacity="1"><rect x="0" y="0" width="540" height="400" rx="16" fill="#E9EFE7" stroke="none" stroke-width="1"/></g><text aria-label="Mapa" data-width="490" xml:space="preserve" x="88" y="368" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#172F2C"><tspan x="88" dy="0">MAPA DE NAVEGACIÓN</tspan><tspan x="88" dy="30.799999999999997"></tspan><tspan x="88" dy="30.799999999999997">Inicio</tspan><tspan x="88" dy="30.799999999999997">   Actividades → Detalle</tspan><tspan x="88" dy="30.799999999999997">   Asociación</tspan><tspan x="88" dy="30.799999999999997">   Contacto</tspan></text><g aria-label="Flujo fondo" transform="translate(636,320)" opacity="1"><rect x="0" y="0" width="580" height="400" rx="16" fill="#E9EFE7" stroke="none" stroke-width="1"/></g><text aria-label="Flujo" data-width="520" xml:space="preserve" x="660" y="366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#172F2C"><tspan x="660" dy="0">FLUJO DE LA TAREA</tspan><tspan x="660" dy="28.0"></tspan><tspan x="660" dy="28.0">Inicio → Detalle → Solicitud</tspan><tspan x="660" dy="28.0">   Correo incompleto → Error → Corregir</tspan><tspan x="660" dy="28.0">   Datos completos → Confirmación</tspan><tspan x="660" dy="28.0"></tspan><tspan x="660" dy="28.0">Los datos y la solicitud son ficticios.</tspan></text></g></svg>