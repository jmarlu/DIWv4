<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img"><title>11 · Imagen y composición</title><g aria-label="11 · Imagen y composición" transform="translate(0,0)" opacity="1"><rect x="0" y="0" width="1280" height="860" rx="0" fill="#FAF8F2" stroke="none" stroke-width="1"/><text aria-label="Sección" data-width="1152" xml:space="preserve" x="64" y="53" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#245C4D"><tspan x="64" dy="0">UD1 / TÉCNICAS VISUALES</tspan></text><text aria-label="Título" data-width="1152" xml:space="preserve" x="64" y="108" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#172F2C"><tspan x="64" dy="0">Misma imagen, distintas decisiones</tspan></text><text aria-label="A" data-width="500" xml:space="preserve" x="64" y="164" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#172F2C"><tspan x="64" dy="0">1. Original y color</tspan></text><svg x="64" y="186" xmlns="http://www.w3.org/2000/svg" width="536" height="348" viewBox="0 0 800 520"><rect width="800" height="520" fill="#D8E1C6"/><circle cx="602" cy="128" r="70" fill="#F4CB79"/><path d="M0 340 L180 150 L405 365 L570 205 L800 370 V520 H0Z" fill="#567769"/><path d="M0 415 L300 265 L555 430 L800 300 V520 H0Z" fill="#245C4D"/><path d="M290 520 L460 377 L500 396 L375 520Z" fill="#F0D39B"/><rect x="80" y="305" width="144" height="98" rx="14" fill="#172F2C"/><rect x="112" y="288" width="52" height="25" rx="5" fill="#172F2C"/><circle cx="153" cy="354" r="34" fill="#FAF8F2"/><circle cx="153" cy="354" r="24" fill="#739286"/><circle cx="198" cy="327" r="5" fill="#F4CB79"/></svg><text aria-label="B" data-width="552" xml:space="preserve" x="664" y="164" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#172F2C"><tspan x="664" dy="0">2. Velo oscuro para proteger el texto</tspan></text><svg x="664" y="186" xmlns="http://www.w3.org/2000/svg" width="536" height="348" viewBox="0 0 800 520"><rect width="800" height="520" fill="#D8E1C6"/><circle cx="602" cy="128" r="70" fill="#F4CB79"/><path d="M0 340 L180 150 L405 365 L570 205 L800 370 V520 H0Z" fill="#567769"/><path d="M0 415 L300 265 L555 430 L800 300 V520 H0Z" fill="#245C4D"/><path d="M290 520 L460 377 L500 396 L375 520Z" fill="#F0D39B"/><rect x="80" y="305" width="144" height="98" rx="14" fill="#172F2C"/><rect x="112" y="288" width="52" height="25" rx="5" fill="#172F2C"/><circle cx="153" cy="354" r="34" fill="#FAF8F2"/><circle cx="153" cy="354" r="24" fill="#739286"/><circle cx="198" cy="327" r="5" fill="#F4CB79"/></svg><g aria-label="Velo" transform="translate(664,186)" opacity="0.55"><rect x="0" y="0" width="536" height="348" rx="0" fill="#172F2C" stroke="none" stroke-width="1"/></g><text aria-label="Texto sobre imagen" data-width="460" xml:space="preserve" x="696" y="362" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF"><tspan x="696" dy="0">Sal a mirar.</tspan></text><text aria-label="Instrucción" data-width="1152" xml:space="preserve" x="64" y="598" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#172F2C"><tspan x="64" dy="0">Cambia la opacidad del velo al 55 %. Comprueba el contraste</tspan><tspan x="64" dy="28.0">en las zonas más claras de la imagen, no solo en una esquina.</tspan></text><text aria-label="Otras técnicas" data-width="1152" xml:space="preserve" x="64" y="686" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#172F2C"><tspan x="64" dy="0">3. Recorta el mismo recurso en una máscara circular.</tspan><tspan x="64" dy="28.0">4. Añade un degradado del fondo opaco a transparente (soft crop).</tspan><tspan x="64" dy="28.0">5. Superpone una etiqueta sin tapar información.</tspan><tspan x="64" dy="28.0">6. Inclina una forma decorativa 6° y compara el equilibrio.</tspan></text></g></svg>